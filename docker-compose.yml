services:
  agency:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:8000"
    env_file: .env
    volumes:
      - agency_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  agency_data:
